<h1>⚽ Partidos de hoy</h1>
<button onclick="cambiarKey()">Cambiar token</button>
<div id="app">Cargando...</div>
<script>
const $=id=>document.getElementById(id);
const M={};
const BASE="https://api.football-data.org/v4";

function cambiarKey(){
  const k=prompt("Pega tu token de football-data.org");
  if(k){localStorage.setItem("fdkey",k.trim());cargar();}
}
async function api(ruta){
  const key=localStorage.getItem("fdkey");
  let r;
  try{r=await fetch(BASE+ruta,{headers:{"X-Auth-Token":key}});}
  catch(e){throw new Error("No se pudo conectar. Revisa tu internet o el token.");}
  let d={};
  try{d=await r.json();}catch(e){}
  if(r.status==429)throw new Error("Muchas consultas seguidas. Espera un minuto.");
  if(r.status==401||r.status==403)throw new Error("Token inválido o sin acceso.");
  if(!r.ok)throw new Error(d.message||("Error "+r.status));
  return d;
}
async function cargar(){
  if(!localStorage.getItem("fdkey")){cambiarKey();return;}
  const hoy=new Date().toLocaleDateString("en-CA",{timeZone:"America/Bogota"});
  const hasta=new Date(new Date(hoy+"T12:00:00Z").getTime()+2*86400000).toISOString().slice(0,10);
  try{
    const d=await api("/matches?dateFrom="+hoy+"&dateTo="+hasta);
    const g={};
    d.matches.forEach(m=>{
      const f=new Date(m.utcDate).toLocaleDateString("en-CA",{timeZone:"America/Bogota"});
      if(f!==hoy)return;
      M[m.id]=m;
      const k=m.area.name+" — "+m.competition.name;
      (g[k]=g[k]||[]).push(m);
    });
    let h="";
    Object.keys(g).sort().forEach(k=>{
      h+="<h2>"+k+"</h2>";
      g[k].forEach(m=>{
        const hora=new Date(m.utcDate).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",timeZone:"America/Bogota"});
        const sc=m.score&&m.score.fullTime&&m.score.fullTime.home!=null?" ("+m.score.fullTime.home+"-"+m.score.fullTime.away+")":"";
        h+='<div class="p" onclick="predecir('+m.id+')"><span>'+m.homeTeam.name+" vs "+m.awayTeam.name+sc+"</span><span>"+hora+'</span></div><div id="d'+m.id+'" class="det" style="display:none"></div>';
      });
    });
    $("app").innerHTML=h||"Hoy no hay partidos en las 12 ligas del plan gratis.";
  }catch(e){$("app").textContent="Error: "+e.message;}
}

async function historial(code){
  const k="h_"+code+"_"+new Date().toDateString();
  const c=localStorage.getItem(k);
  if(c)return JSON.parse(c);
  const d=await api("/competitions/"+code+"/matches?status=FINISHED");
  const lista=d.matches
    .filter(x=>x.score&&x.score.fullTime&&x.score.fullTime.home!=null)
    .map(x=>[Date.parse(x.utcDate)/1000,x.homeTeam.id,x.awayTeam.id,x.score.fullTime.home,x.score.fullTime.away])
    .sort((a,b)=>a[0]-b[0]);
  try{localStorage.setItem(k,JSON.stringify(lista));}catch(e){}
  return lista;
}

    T[a]=T[a]||{hf:0,hc:0,hn:0,af:0,ac:0,an:0};
