<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Predicciones">
<title>Predicciones</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#0f172a;color:#e2e8f0}
h1{font-size:22px}
h2{font-size:15px;color:#38bdf8;margin:18px 0 6px}
.p{background:#1e293b;border-radius:10px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;gap:8px}
.det{background:#162032;border-radius:10px;padding:10px;margin:-2px 0 8px;font-size:14px;line-height:1.6}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0;font-size:12px;color:#0f172a}
.bar div{display:flex;align-items:center;justify-content:center}
.mod{margin:2px 0;color:#cbd5e1}
.nota{font-size:12px;color:#94a3b8;margin-top:8px}
</style></head><body>
<h1>⚽ Partidos de hoy</h1>
<div id="app">Cargando...</div>
<script>
const $=id=>document.getElementById(id);
const M={};
const BASE="https://futbol-proxy.david24fmv.workers.dev/v4";

async function api(ruta){
  let r;
  try{r=await fetch(BASE+ruta);}
  catch(e){throw new Error("No se pudo conectar con el intermediario.");}
  let d={};
  try{d=await r.json();}catch(e){}
  if(r.status==429)throw new Error("Muchas consultas seguidas. Espera un minuto.");
  if(r.status==401||r.status==403)throw new Error("Token inválido o sin acceso. Revisa el token en Cloudflare.");
  if(!r.ok)throw new Error(d.message||("Error "+r.status));
  return d;
}
async function cargar(){
  const hoy=new Date().toLocaleDateString("en-CA",{timeZone:"America/Bogota"});
  const hasta=new Date(new Date(hoy+"T12:00:00Z").getTime()+2*86400000).toISOString().slice(0,10);
  try{
    const d=await api("/matches?dateFrom="+hoy+"&dateTo="+hasta);
    const g={};
    d.matches.forEach(m=>{
      const f=new Date(m.utcDate).toLocaleDateString("en-CA",{timeZone:"America/Bogota"});
      if(f!==hoy)return;
      M[m.id]=m;
      const k=m.area.name+" — "+m.competition.name;
      (g[k]=g[k]||[]).push(m);
    });
    let h="";
    Object.keys(g).sort().forEach(k=>{
      h+="<h2>"+k+"</h2>";
      g[k].forEach(m=>{
        const hora=new Date(m.utcDate).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",timeZone:"America/Bogota"});
        const sc=m.score&&m.score.fullTime&&m.score.fullTime.home!=null?" ("+m.score.fullTime.home+"-"+m.score.fullTime.away+")":"";
        h+='<div class="p" onclick="predecir('+m.id+')"><span>'+m.homeTeam.name+" vs "+m.awayTeam.name+sc+"</span><span>"+hora+'</span></div><div id="d'+m.id+'" class="det" style="display:none"></div>';
      });
    });
    $("app").innerHTML=h||"Hoy no hay partidos en las 12 ligas del plan gratis.";
  }catch(e){$("app").textContent="Error: "+e.message;}
}

async function historial(code){
  const k="h_"+code+"_"+new Date().toDateString();
  const c=localStorage.getItem(k);
  if(c)return JSON.parse(c);
  const d=await api("/competitions/"+code+"/matches?status=FINISHED");
  const lista=d.matches
    .filter(x=>x.score&&x.score.fullTime&&x.score.fullTime.home!=null)
    .map(x=>[Date.parse(x.utcDate)/1000,x.homeTeam.id,x.awayTeam.id,x.score.fullTime.home,x.score.fullTime.away])
    .sort((a,b)=>a[0]-b[0]);
  try{localStorage.setItem(k,JSON.stringify(lista));}catch(e){}
  return lista;
}

// Fuerza de ataque y defensa (xi>0 da más peso a partidos recientes)
function fuerza(lista,xi){
  const ahora=Date.now()/1000;
  let sH=0,sA=0,W=0;
  const T={};
  lista.forEach(([t,h,a,gh,ga])=>{
    const w=Math.exp(-xi*(ahora-t)/86400);
    sH+=w*gh;sA+=w*ga;W+=w;
    T[h]=T[h]||{hf:0,hc:0,hn:0,af:0,ac:0,an:0};
    T[a]=T[a]||{hf:0,hc:0,hn:0,af:0,ac:0,an:0};
    T[h].hf+=w*gh;T[h].hc+=w*ga;T[h].hn+=w;
    T[a].af+=w*ga;T[a].ac+=w*gh;T[a].an+=w;
  });
  return{T:T,mh:W?sH/W:1.45,ma:W?sA/W:1.15,W:W};
}
function lambdas(F,h,a){
  const k=4,z={hf:0,hc:0,hn:0,af:0,ac:0,an:0};
  const H=F.T[h]||z,A=F.T[a]||z;
  const attH=(H.hf+k*F.mh)/(H.hn+k)/F.mh;
  const defH=(H.hc+k*F.ma)/(H.hn+k)/F.ma;
  const attA=(A.af+k*F.ma)/(A.an+k)/F.ma;
  const defA=(A.ac+k*F.mh)/(A.an+k)/F.mh;
  return{lh:F.mh*attH*defA,la:F.ma*attA*defH};
}

function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function pois(k,l){return Math.exp(-l)*Math.pow(l,k)/fact(k);}
function poisson(lh,la,rho){
  let h=0,d=0,a=0,o25=0,bt=0,best=[0,0,0];
  for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){
    let p=pois(i,lh)*pois(j,la);
    if(rho){
      if(i==0&&j==0)p*=1-lh*la*rho;
      else if(i==0&&j==1)p*=1+lh*rho;
      else if(i==1&&j==0)p*=1+la*rho;
      else if(i==1&&j==1)p*=1-rho;
    }
    if(i>j)h+=p;else if(i==j)d+=p;else a+=p;
    if(i+j>2)o25+=p;
    if(i>0&&j>0)bt+=p;
    if(p>best[2])best=[i,j,p];
  }
  const s=h+d+a;
  return{h:h/s,d:d/s,a:a/s,o25:o25/s,bt:bt/s,marc:best[0]+"-"+best[1]};
}

function calcElo(lista){
  const R={},K=20,HA=60;
  lista.forEach(([t,h,a,gh,ga])=>{
    const rh=R[h]??1500,ra=R[a]??1500;
    const e=1/(1+Math.pow(10,-(rh+HA-ra)/400));
    const s=gh>ga?1:gh==ga?0.5:0;
    const dif=Math.abs(gh-ga);
    const mult=dif<=1?1:dif==2?1.5:(11+dif)/8;
    const cambio=K*mult*(s-e);
    R[h]=rh+cambio;R[a]=ra-cambio;
  });
  return R;
}
function eloProb(R,h,a){
  const dr=(R[h]??1500)+60-(R[a]??1500);
  const e=1/(1+Math.pow(10,-dr/400));
  const pd=0.30*Math.exp(-Math.pow(dr/450,2));
  const ph=Math.max(0.02,e-pd/2),pa=Math.max(0.02,1-e-pd/2);
  const s=ph+pd+pa;
  return{h:ph/s,d:pd/s,a:pa/s};
}

const pc=x=>(x*100).toFixed(0)+"%";
const fila=r=>pc(r.h)+" · "+pc(r.d)+" · "+pc(r.a);
const barra=r=>'<div class="bar"><div style="width:'+pc(r.h)+';background:#4ade80">'+pc(r.h)+'</div><div style="width:'+pc(r.d)+';background:#fbbf24">'+pc(r.d)+'</div><div style="width:'+pc(r.a)+';background:#f87171">'+pc(r.a)+"</div></div>";

async function predecir(id){
  const box=$("d"+id);
  if(box.style.display==="block"){box.style.display="none";return;}
  box.style.display="block";
  box.textContent="Calculando...";
  const m=M[id];
  try{
    const lista=await historial(m.competition.code);
    const h=m.homeTeam.id,a=m.awayTeam.id;
    const L0=lambdas(fuerza(lista,0),h,a);
    const L1=lambdas(fuerza(lista,0.006),h,a);
    const p=poisson(L0.lh,L0.la,0);
    const dc=poisson(L1.lh,L1.la,-0.1);
    const e=eloProb(calcElo(lista),h,a);
    const prom={h:(p.h+dc.h+e.h)/3,d:(p.d+dc.d+e.d)/3,a:(p.a+dc.a+e.a)/3};
    box.innerHTML=
      "<b>Resultado</b> (local · empate · visitante)<br>"+
      '<div class="mod">Poisson: '+fila(p)+"</div>"+
      '<div class="mod">Dixon-Coles: '+fila(dc)+"</div>"+
      '<div class="mod">Elo: '+fila(e)+"</div>"+
      "<b>Promedio de los 3</b>"+barra(prom)+
      m.homeTeam.name+" gana · Empate · "+m.awayTeam.name+" gana<br><br>"+
      "Goles esperados: "+L1.lh.toFixed(2)+" - "+L1.la.toFixed(2)+"<br>"+
      "Marcador más probable: <b>"+dc.marc+"</b><br>"+
      "Más de 2.5 goles: <b>"+pc(dc.o25)+"</b> · Menos: "+pc(1-dc.o25)+"<br>"+
      "Ambos marcan: <b>"+pc(dc.bt)+"</b> · No: "+pc(1-dc.bt)+
      '<div class="nota">Basado en '+lista.length+' partidos de la temporada actual. Con pocos partidos la estimación es débil. No es una certeza.</div>';
  }catch(err){box.textContent="Error: "+err.message;}
}
cargar();
</script></body></html>
